submitter: joniler
source_repo: https://github.com/outcrop-labs/talaria
summary: Multitenant desktop shell for hosted Talaria instances
description: >-
  Builds Talaria Desktop from source at tag v0.1.0: the Svelte/Vite frontend
  is compiled offline from a vendored bun cache (node-sources.json) and the
  Tauri v2 shell from vendored crates (cargo-sources.json), linked against
  the WebKitGTK 4.1 that org.gnome.Platform//50 carries. Rust 1.97.1 and
  bun 1.4.0 enter as sha-pinned source modules — no sdk-extensions, since
  the runner cannot cross-mount date-versioned fd extensions on GNOME
  runtimes.
license: MIT
homepage: https://github.com/outcrop-labs/talaria
tags: [business, utility]
