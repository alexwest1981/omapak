# Talaria Desktop — source build. Their own release flatpak stages a prebuilt
# FHS tree (desktop/packaging/flatpak in the talaria repo); omapak builds
# from the tag instead. GNOME's runtime is the one that carries WebKitGTK
# 4.1, which the shell links against.
app-id: app.talaria.desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: talaria-desktop

finish-args:
  # The shell is a client: every instance it shows is remote. Nothing else
  # about the host is shared — no home, no host filesystem.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri # WebKit composites on the GPU wherever it can
  - --talk-name=org.freedesktop.portal.* # browser-based OAuth, when it lands

# No sdk-extensions, deliberately: rust-stable and node are date-versioned
# fd extensions with no //50 branch, and the runner's flatpak 1.14 cannot
# cross-mount them on GNOME's numbered runtimes. The toolchains below are
# sha-pinned source modules instead — buildable on any flatpak.
modules:
  - name: rust
    buildsystem: simple
    # desktop/src-tauri/rust-toolchain.toml pins 1.97.1 (edition 2024 + the
    # tauri `unstable` multiwebview feature); the dist tarball is
    # self-contained and installs into the build env only.
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.97.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 88f28fa9af20594179f85d6df67078dfd6fa93e2f6da5e1e9b0ac4997988ca4f
    build-commands:
      - ./install.sh --prefix=/app --without=rust-docs
    cleanup:
      - /bin/cargo
      - /bin/rustc
      - /bin/rustdoc
      - /bin/rustfmt
      - /bin/clippy-driver
      - /lib/rustlib
      - /lib/librustc_driver.so

  - name: bun
    buildsystem: simple
    # Their CI pins bun 1.4.0 (desktop-package.yml); the lockfile installs
    # and builds offline against the seeded cache (node-sources.json).
    sources:
      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
        sha256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
    build-commands:
      # flatpak-builder strips the zip's single top dir (bun-linux-x64/);
      # the exec bit is not guaranteed by zip extraction either
      - install -Dm755 bun /app/bin/bun
    cleanup:
      - /bin/bun

  - name: talaria
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/talaria/cargo
        BUN_INSTALL_CACHE_DIR: /run/build/talaria/bun_cache
    sources:
      - type: git
        url: https://github.com/outcrop-labs/talaria
        tag: v0.1.0
        commit: 3af432bea05560f8b64ec855fef098e480aa3848
      - cargo-sources.json
      - node-sources.json
      - type: inline
        dest: cargo
        dest-filename: config
        contents: |
          [source.vendored-sources]
          directory = "cargo/vendor"

          [source.crates-io]
          replace-with = "vendored-sources"
      - type: file
        path: app.talaria.desktop.desktop
      - type: file
        path: app.talaria.desktop.metainfo.xml
    build-commands:
      # Frontend: vendored in node-sources.json as bun's offline install
      # cache (bun_cache/<name>@<version>@@@1/), consumed via --offline.
      - cd desktop && bun install --frozen-lockfile --offline
      - cd desktop && bun run build:vite
      # Shell: the tauri CLI is a wrapper; tauri-build + generate_context!
      # embed ../dist at compile time, so a plain cargo build suffices.
      - cd desktop/src-tauri && cargo build --release --offline --locked
      - install -Dm755 desktop/src-tauri/target/release/talaria-desktop /app/bin/talaria-desktop
      # Icons: flatpak looks these up by app id, not binary name.
      - install -Dm644 desktop/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/app.talaria.desktop.png
      - install -Dm644 desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/app.talaria.desktop.png
      - install -Dm644 "desktop/src-tauri/icons/128x128@2x.png" /app/share/icons/hicolor/256x256/apps/app.talaria.desktop.png
      - install -Dm644 desktop/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/app.talaria.desktop.png
      - install -Dm644 app.talaria.desktop.desktop /app/share/applications/app.talaria.desktop.desktop
      - install -Dm644 app.talaria.desktop.metainfo.xml /app/share/metainfo/app.talaria.desktop.metainfo.xml
      - desktop-file-validate /app/share/applications/app.talaria.desktop.desktop
