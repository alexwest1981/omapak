submitter: alexwest1981
source_repo: https://github.com/alexwest1981/OmarchyTube
summary: OmarchyTube, a full-screen YouTube client for Omarchy and Hyprland
description: >-
  Alex's own app, submitted by its author: an Electron client that puts YouTube
  in one full-screen window built for Omarchy and Hyprland, with a TV/leanback
  mode, a desktop mode on F2, sign-in through Google's OAuth device flow (a QR
  code, never a password typed into the app), network-level and cosmetic ad
  blocking, SponsorBlock skipping and Return YouTube Dislike counts.

  It is built for the 10-foot case on one Hyprland output rather than as a
  desktop browser replacement. Browsing is the app's own grid rather than
  YouTube's leanback shelves — seven columns of cards on a 1920-wide screen,
  arrow keys, and the search box on top — while playback stays on YouTube's own
  watch page, which is what keeps the ad skipping, SponsorBlock, the dislike
  counts and the floating back button working.

  Two things a user should know, both deliberate and both pinned by a test.
  Requests to YouTube carry a TV user agent in TV mode and an X11-Chrome one in
  desktop mode, with matching Client Hints: Google's device-flow sign-in only
  opens for something that looks like a TV, and the watch page expects the
  Chrome it is told it is. The app contacts YouTube, the SponsorBlock API and
  the Return YouTube Dislike API, and nothing else — no telemetry. The renderer
  runs with `sandbox` off but contextIsolation on, nodeIntegration off,
  webSecurity on and Widevine enabled for DRM; the bridge it exposes is four
  named channels (exit a video, browse home, browse search, play a video) with
  no file, shell or clipboard access.

  The runtime branch is 25.08 and not 26.08 for a measured reason: the build
  needs org.freedesktop.Sdk.Extension.node24, those extensions are published up
  to 25.08 only. `node --test` checks run in CI on every push — dependency,
  licence
  and metadata agreement, InnerTube responses parsed against a captured fixture,
  leanback density, and both user-agent identities pinned so TV mode cannot
  silently start sending a desktop agent.
