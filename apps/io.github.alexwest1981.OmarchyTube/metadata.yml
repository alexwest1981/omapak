submitter: alexwest1981
source_repo: https://github.com/alexwest1981/OmarchyTube
summary: OmarchyTube, a full-screen YouTube client for Omarchy and Hyprland
description: >-
  Alex's own app, submitted by its author. OmarchyTube is an Electron client
  that puts YouTube in a single full-screen window built for Omarchy and
  Hyprland: a TV/leanback mode for arrow-key navigation, a desktop mode on F2,
  sign-in through Google's OAuth device flow (a QR code, no password typed
  into the app), network-level and cosmetic ad blocking, SponsorBlock
  skipping and Return YouTube Dislike counts. The project publishes no release
  artifact, so the manifest builds the git tree the way flathub's own
  Electron-from-source recipe does: npm dependencies and the Electron 44.3.0
  zip the lockfile pins are both vendored through generated-sources.json, and
  the build runs with no network access. The app contacts YouTube, the
  SponsorBlock API and the Return YouTube Dislike API, and nothing else — no
  telemetry, no analytics.

  It is built for the 10-foot case on one Hyprland output rather than as a
  desktop browser replacement: a leanback mode driven by the arrow keys, a
  desktop mode on F2, sign-in by QR device flow so no password is typed into
  the app, and ad blocking at the network layer. The runtime branch is 25.08
  and not 26.08 for a measured reason: the build needs
  org.freedesktop.Sdk.Extension.node24, and the freedesktop node SDK
  extensions are published up to 25.08 only (checked against flathub —
  node24//25.08 is the newest branch that exists), so 25.08 is the newest
  branch this app can build on.
license: MIT
