summary: A native audiobook library and player with chapters and saved progress
license: MIT
homepage: https://github.com/unTanana/oma-audio-books
tags: [audio, audiobooks, player, qt, omarchy]
description: >-
  Submitted by the author. A C++20 and Qt Quick player for local DRM-free MP3
  book folders and M4B files, with series grouping, bookmarks, favorites,
  per-book speed, sleep timer, chapter timeline previews, keyboard controls,
  and listening progress saved across restarts. It does not download books,
  remove DRM, contact Audible, or require an account or network connection.
  Books are selected through the file chooser portal; the app reads media
  without modifying it and stores its catalog in its own Flatpak data directory.
  Optional Omarchy theme integration reads only the granted theme directories.
  Other desktops have built-in dark and light appearances. The KDE 6.11 runtime
  supplies Qt Multimedia, SQLite, ffmpeg and ffprobe; the manifest builds from
  pinned source and runs the integration, performance and scanner checks.
