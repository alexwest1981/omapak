app-id: io.github.unTanana.oma-audio-books
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: oma-audio-books
rename-desktop-file: oma-audio-books.desktop
rename-icon: oma-audio-books

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  # Books and cover images are selected through the file chooser portal.
  # Only Omarchy palettes and their theme symlink targets are exposed directly.
  - --filesystem=~/.local/state/omarchy/current:ro
  - --filesystem=xdg-config/omarchy/current:ro
  - --filesystem=xdg-config/omarchy/themes:ro
  - --filesystem=xdg-data/omarchy/themes:ro

modules:
  - name: oma-audio-books
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    build-options:
      env:
        CTEST_OUTPUT_ON_FAILURE: "1"
    run-tests: true
    post-install:
      - install -Dm644 io.github.unTanana.oma-audio-books.metainfo.xml /app/share/metainfo/io.github.unTanana.oma-audio-books.metainfo.xml
    sources:
      - type: git
        url: https://github.com/unTanana/oma-audio-books.git
        commit: 8dd1c64bc1598f8acda5a88e34c421e070fdf0bd
      - type: file
        path: io.github.unTanana.oma-audio-books.metainfo.xml
