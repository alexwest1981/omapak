submitter: alexwest1981
source_repo: https://github.com/alexwest1981/OmaAmp
summary: OmaAmp, a Winamp 2.91-style audio player with a real DSP chain
description: >-
  Alex's own app, submitted by its author. OmaAmp is a PyQt6 audio player in
  the shape of Winamp 2.91: LED clock, spectrum analyzer, marquee, 10-band IIR
  biquad equalizer with a live response curve, six visualizer modes, a
  drag-and-drop playlist editor, .wsz skin support and a theme studio. Local
  playback goes through miniaudio/soundfile and needs no network. Radio and
  YouTube streams do: the streams are fetched by yt-dlp and decoded by ffmpeg,
  and both tools are already in this flatpak — measured in the built sandbox,
  `command -v ffmpeg` and `command -v ffprobe` resolve to the runtime's
  /usr/bin and yt-dlp 2026.08.19 imports from the app's own generated Python
  dependencies, so the stream path is not blocked by anything missing here.
  The theme-sharing feature is
  opt-in and uses a GitHub token the user pastes themselves to publish a gist
  in their own account. The project publishes no release artifact, so the
  manifest builds the git tree with its Python dependencies generated by
  flatpak-pip-generator against the same runtime the sandbox runs.

  Its point of difference from the other Winamp-shaped players is the theme
  engine: a skin is a plain file the player reads and writes, the six
  visualizer modes and the live EQ response curve are drawn from the samples
  being played, and the whole window stays Winamp 2.91 rather than a modern
  player in a retro costume. The archive import is zip-slip guarded, and
  that guard carries its own test (tests/test_safe_zip.py).
