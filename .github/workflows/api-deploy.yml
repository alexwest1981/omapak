name: api-deploy

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Typecheck
        working-directory: api
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      # ── One-time infra, idempotent on every run ─────────────────────────────

      - name: Bootstrap D1 database (create if missing, pin the real id)
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler d1 create omapak-api || true
          ID=$(bunx wrangler d1 info omapak-api --json | jq -r '.uuid')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "could not resolve D1 database id"; exit 1
          fi
          echo "omapak-api D1 id: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Apply D1 migrations
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply omapak-api --remote

      - name: Deploy the api worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Bootstrap worker secrets
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Session signing key: generated once, kept server-side only.
          # Losing it just invalidates sessions — no other state depends on it.
          if ! bunx wrangler secret list | grep -q '"SESSION_SECRET"'; then
            openssl rand -hex 32 | tr -d '\n' | bunx wrangler secret put SESSION_SECRET
            echo "SESSION_SECRET generated"
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | bunx wrangler secret put RESEND_API_KEY
            echo "RESEND_API_KEY uploaded"
          else
            echo "::warning::RESEND_API_KEY GitHub secret is not set — sign-in emails return 503 until it is (api/README.md → production setup)"
          fi

      - name: Bootstrap DNS for api.omapak.org (proxied placeholder A record)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=omapak.org" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then
            echo "::warning::could not look up zone omapak.org (token scope?) — add a proxied A record for api.omapak.org manually"
            exit 0
          fi
          COUNT=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=api.omapak.org" | jq '.result | length')
          if [ "$COUNT" = "0" ]; then
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              -d '{"type":"A","name":"api.omapak.org","content":"192.0.2.1","proxied":true,"comment":"api worker route"}' \
              | jq -e '.success' >/dev/null && echo "DNS record created"
          else
            echo "DNS record for api.omapak.org already present"
          fi

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://api.omapak.org/healthz; then echo; exit 0; fi
            sleep 15
          done
          echo "::warning::https://api.omapak.org/healthz not answering yet (DNS propagation?)"
